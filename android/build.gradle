// Compatibility values for older Android plugins that still read project.flutter.
ext.flutter = [
    compileSdkVersion: 35,
    minSdkVersion: 21,
    targetSdkVersion: 35,
    ndkVersion: "26.3.11579264",
    versionCode: 1,
    versionName: "1.0.0"
]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
